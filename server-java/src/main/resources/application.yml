spring:
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        connection:
          isolation: 2  # READ_COMMITTED (1=RU, 2=RC, 4=RR, 8=SR)

logging:
  level:
    org.hibernate.SQL: DEBUG

# 외부 API 설정
external:
  api:
    url: http://localhost:9090  # 외부 데이터 플랫폼 URL

